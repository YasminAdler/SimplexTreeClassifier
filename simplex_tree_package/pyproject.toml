[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplex-tree-classifier"
version = "0.1.0"
description = "Hierarchical simplex-tree classifier with barycentric embedding, GPU-accelerated transform, and non-convex boundary pruning."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yasmin" }]
keywords = [
    "machine-learning",
    "classifier",
    "simplex",
    "barycentric",
    "interpretability",
    "surrogate-model",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "torch>=1.12",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.4"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/yasmin/SimplexTreeClassifier"
Repository = "https://github.com/yasmin/SimplexTreeClassifier"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
